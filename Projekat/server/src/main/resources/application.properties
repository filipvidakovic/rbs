spring.application.name=server

# Server
server.port=8080

# DataSource (PostgreSQL)
# Override these via environment variables in production:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/oblak_db
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway (DB migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File Storage
# Absolute path where verified Python functions are stored permanently.
# Each function is saved as:  <oblak.storage.base-path>/<hash>/handler.py
# (and optionally requirements.txt alongside it)
oblak.storage.base-path=./storage/functions

# Temporary directory used during verification (auto-cleaned after each upload)
oblak.storage.temp-path=./storage/temp

# Code Verifier
# Path to the verifier.py script (absolute or relative to the working directory)
oblak.verifier.script-path=src/main/resources/scripts/verifier.py

# Bandit confidence/severity thresholds - values: LOW | MEDIUM | HIGH
# Uploads whose issues meet or exceed both thresholds will be REJECTED.
oblak.verifier.bandit.min-severity=LOW
oblak.verifier.bandit.min-confidence=MEDIUM

# Multipart Upload Limits
# Limit upload size to 5 MB to reduce the attack surface.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Actuator (health only - no sensitive endpoints exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never